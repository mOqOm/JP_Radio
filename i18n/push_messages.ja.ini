# 共通
APP_TITLE = JP Radio

# Boot / Status
BOOT_COMPLETED = 起動しました
ALREADY_STARTED = すでに起動しています
STOPPED = 停止しました

# Error
ERROR_BOOT_TITLE = JP Radio 起動エラー
ERROR_START_FAILED_TITLE = JP Radio 起動失敗
ERROR_PORT_IN_USE = ポート {0} はすでに使用中です。JP Radio を開始できません。
